<!DOCTYPE html>
<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PandaTrainer</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pandaGreen: '#51a200',
                        pandaDark: '#373737',
                        pandaLight: '#f9fafb',
                    }
                }
            }
        }
    </script>
    <style>
        /* Ocultar barra de desplazamiento para las categorías */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animación suave para el Modal */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Animación espectacular al completar ejercicio */
        @keyframes completeAnim {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.5) translateX(200%); opacity: 0; }
        }
        .complete-anim { animation: completeAnim 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; pointer-events: none; }

        /* Animación del mensaje motivacional flotante (Toast) */
        @keyframes toastFadeInOut {
            0% { opacity: 0; transform: translateY(50px) scale(0.8); }
            15% { opacity: 1; transform: translateY(0) scale(1.05); }
            25% { opacity: 1; transform: translateY(0) scale(1); }
            85% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }
        .toast-anim { animation: toastFadeInOut 3.5s ease-in-out forwards; }
    </style>
    <script>
        // Aplicar modo oscuro al cargar si es la preferencia del usuario
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>

            { id: 47, file: "Curl with Multipurpose V bar.mp4", cat: ["Biceps"], en: "Curl with V-Bar", es: "Curl con barra en V" },
            { id: 48, file: "High Pulley Overhead Tricep Extension.mp4", cat: ["Triceps"], en: "High Pulley Tricep Ext.", es: "Extensión de tríceps en polea alta" },
            { id: 49, file: "Cable-Mid-Fly_Chest.gif", cat: ["Chest"], en: "Cable Mid Fly", es: "Cruce medio en polea" },
            { id: 50, file: "Cable-Low-Fly_Chest.mp4", cat: ["Chest"], en: "Cable Low Fly", es: "Cruce bajo en polea" },
            { id: 51, file: "Cable-Standing-Up-Straight-Crossovers_Chest-flat.mp4", cat: ["Chest"], en: "Standing Straight Crossovers", es: "Cruce de pie recto" },
            { id: 52, file: "Cable-Decline-Fly_Chest-flat.mp4", cat: ["Chest"], en: "Decline Cable Fly", es: "Cruce declinado en polea" },
            { id: 53, file: "Cable-Lying-Fly_Chest-flat.mp4", cat: ["Chest"], en: "Lying Cable Fly", es: "Cruce tumbado en polea" },
            { id: 54, file: "Cable-Incline-Bench-Press_Chest-flat.mp4", cat: ["Chest"], en: "Incline Cable Bench Press", es: "Press de banca inclinado en polea" },
            { id: 55, file: "Cable-Bar-Lateral-Pulldown_Back-flat.mp4", cat: ["Back"], en: "Bar Lateral Pulldown", es: "Jalón lateral con barra" },
            { id: 56, file: "caminar-en-cinta.mp4", cat: ["Cardio"], en: "Treadmill Walking", es: "Caminar en cinta", isCardio: true },
            { id: 57, file: "correr-en-cinta.mp4", cat: ["Cardio"], en: "Treadmill Running", es: "Correr en cinta", isCardio: true }
        ];

        // FUNCIÓN PARA MODO OSCURO
        function toggleTheme() {
            const root = document.documentElement;
            if (root.classList.contains('dark')) {
                root.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                document.getElementById('icon-sun').classList.add('hidden');
                document.getElementById('icon-moon').classList.remove('hidden');
            } else {
                root.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('icon-moon').classList.add('hidden');
                document.getElementById('icon-sun').classList.remove('hidden');
            }
        }

        // FUNCIÓN PARA GENERAR LA RUTA EXACTA DEL MEDIO (Sin paréntesis)
        function getMediaUrl(filename) {
            const baseUrl = "https://jugandoatraducir.com/wp-content/uploads/2026/05/";
            let formattedName = filename.replace(/\s+/g, '-');
            formattedName = formattedName.replace(/[()]/g, '');
            return baseUrl + formattedName;
        }

        // FUNCIÓN PARA ALTERNAR LA VISTA (MÓVIL / PC)
        function toggleViewMode() {
            isMobileViewForce = !isMobileViewForce;
            const container = document.getElementById('app-container');
            const exList = document.getElementById('exercises-list');
            const roList = document.getElementById('routine-list');
            const iconMobile = document.getElementById('icon-mobile');
            const iconPc = document.getElementById('icon-pc');

            if (isMobileViewForce) {
                container.classList.remove('max-w-5xl');
                container.classList.add('max-w-md');
                exList.classList.remove('md:grid-cols-2', 'lg:grid-cols-3');
                roList.classList.remove('lg:grid-cols-2');
                iconPc.classList.add('hidden');
                iconMobile.classList.remove('hidden');
            } else {
                container.classList.remove('max-w-md');
                container.classList.add('max-w-5xl');
                exList.classList.add('md:grid-cols-2', 'lg:grid-cols-3');
                roList.classList.add('lg:grid-cols-2');
                iconMobile.classList.add('hidden');
                iconPc.classList.remove('hidden');
            }
        }

        // CONTROL DE IDIOMA
        function setLang(lang) {
            currentLang = lang;
            
            const btnEs = document.getElementById('lang-es');
            const btnEn = document.getElementById('lang-en');
            
            if (lang === 'es') {
                btnEs.className = "text-pandaGreen hover:scale-110 transition-transform";
                btnEn.className = "text-gray-400 dark:text-gray-500 hover:scale-110 transition-transform";
            } else {
                btnEn.className = "text-pandaGreen hover:scale-110 transition-transform";
                btnEs.className = "text-gray-400 dark:text-gray-500 hover:scale-110 transition-transform";
            }
            
            document.querySelectorAll('[data-lang]').forEach(el => {
                if (el.getAttribute('data-lang') === currentLang) {
                    if (el.tagName === 'SPAN') {
                        el.classList.remove('hidden'); 
                    } else {
                        el.classList.remove('hidden');
                    }
                } else {
                    el.classList.add('hidden');
                }
            });

            renderFilters();
            renderExercises();
            renderRoutine();
        }

        // CAMBIO DE PESTAÑAS (Ejercicios vs Rutina)
        function switchTab(tab) {
            const btnEx = document.getElementById('tab-exercises');
            const btnRo = document.getElementById('tab-routine');
            const viewEx = document.getElementById('view-exercises');
            const viewRo = document.getElementById('view-routine');

            if (tab === 'exercises') {
                btnEx.classList.add('text-pandaGreen', 'border-pandaGreen');
                btnEx.classList.remove('text-gray-500', 'dark:text-gray-400', 'border-transparent');
                btnRo.classList.add('text-gray-500', 'dark:text-gray-400', 'border-transparent');
                btnRo.classList.remove('text-pandaGreen', 'border-pandaGreen');
                viewEx.classList.remove('hidden');
                viewRo.classList.add('hidden');
            } else {
                btnRo.classList.add('text-pandaGreen', 'border-pandaGreen');
                btnRo.classList.remove('text-gray-500', 'dark:text-gray-400', 'border-transparent');
                btnEx.classList.add('text-gray-500', 'dark:text-gray-400', 'border-transparent');
                btnEx.classList.remove('text-pandaGreen', 'border-pandaGreen');
                viewRo.classList.remove('hidden');
                viewEx.classList.add('hidden');
                renderRoutine();
            }
        }

        // RENDERIZAR FILTROS DE CATEGORÍAS
        function renderFilters() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '';

            categories.forEach(cat => {
                const isSelected = currentCategory === cat.id;
                const btn = document.createElement('button');
                
                btn.className = `whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${
                    isSelected ? 'bg-pandaGreen text-white shadow-md' : 'bg-white dark:bg-gray-800 text-pandaDark dark:text-gray-200 border border-gray-200 dark:border-gray-700'
                }`;
                btn.innerText = currentLang === 'es' ? cat.es : cat.en;
                
                btn.onclick = () => {
                    currentCategory = cat.id;
                    renderFilters(); 
                    renderExercises();
                };
                
                container.appendChild(btn);
            });
        }

        // RENDERIZAR LISTA DE EJERCICIOS
        function renderExercises() {
            const container = document.getElementById('exercises-list');
            container.innerHTML = '';

            const filteredDb = currentCategory === 'All' 
                ? db 
                : db.filter(ex => ex.cat.includes(currentCategory));

            if (filteredDb.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 dark:text-gray-500 mt-6 col-span-full">${currentLang === 'es' ? 'No hay ejercicios en esta categoría aún.' : 'No exercises in this category yet.'}</p>`;
                return;
            }

            filteredDb.forEach(ex => {
                const catNames = ex.cat.map(cId => categories.find(c => c.id === cId)[currentLang]).join(', ');
                const exName = currentLang === 'es' ? ex.es : ex.en;
                const isImg = !ex.file.toLowerCase().endsWith('.mp4');

                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between hover:shadow-md transition-shadow cursor-pointer";
                card.onclick = () => openModal(ex.id);

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 flex-shrink-0 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-pandaGreen overflow-hidden">
                            ${isImg 
                                ? `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`
                                : `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>`
                            }
                        </div>
                        <div>
                            <h4 class="font-bold text-pandaDark dark:text-gray-100 text-sm leading-tight">${exName}</h4>
                            <span class="text-xs text-pandaGreen font-semibold">${catNames}</span>
                        </div>
                    </div>
                    <button class="w-8 h-8 rounded-full bg-pandaLight dark:bg-gray-700 flex items-center justify-center text-pandaDark dark:text-gray-200 hover:bg-pandaGreen dark:hover:bg-pandaGreen hover:text-white dark:hover:text-white transition-colors flex-shrink-0" onclick="event.stopPropagation(); addToRoutine(${ex.id})">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // FUNCIONALIDAD DEL MODAL
        function openModal(id) {
            const ex = db.find(e => e.id === id);
            if (!ex) return;

            const modal = document.getElementById('modal');
            const mediaContainer = document.getElementById('modal-media');
            const title = document.getElementById('modal-title');
            const cat = document.getElementById('modal-category');
            const addBtn = document.getElementById('modal-add-btn');

            title.innerText = currentLang === 'es' ? ex.es : ex.en;
            cat.innerText = ex.cat.map(cId => categories.find(c => c.id === cId)[currentLang]).join(', ');

            const mediaUrl = getMediaUrl(ex.file);
            mediaContainer.innerHTML = ''; 
            
            if (ex.file.toLowerCase().endsWith('.mp4')) {
                const video = document.createElement('video');
                video.src = mediaUrl;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.className = "w-full h-full object-contain";
                mediaContainer.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = mediaUrl;
                img.className = "w-full h-full object-contain";
                mediaContainer.appendChild(img);
            }

            addBtn.onclick = () => {
                addToRoutine(ex.id);
                closeModal();
            };

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal-media').innerHTML = ''; 
        }

        function scrollCategories(direction) {
            const container = document.getElementById('category-filters');
            const scrollAmount = 180;
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        // --- CREADOR Y GESTOR DE RUTINAS ---

        function addToRoutine(id) {
            const ex = db.find(e => e.id === id);
            let routineItem = { ...ex };
            
            if (ex.isCardio) {
                routineItem.mins = 15;
            } else {
                routineItem.sets = 3;
                routineItem.reps = 12;
            }
            
            routine.push(routineItem);
            saveRoutine();
            alert(currentLang === 'es' ? 'Añadido a tu rutina' : 'Added to your routine');
            
            // Ocultar banner de rutina previa si el usuario empieza a añadir cosas nuevas
            document.getElementById('previous-routine-banner').classList.add('hidden');
        }

        function saveRoutine() {
            localStorage.setItem('pandaTrainerRoutine', JSON.stringify(routine));
            if (!document.getElementById('view-routine').classList.contains('hidden')) {
                renderRoutine();
            }
        }
        
        function loadPreviousRoutine() {
            routine = [...savedRoutine];
            document.getElementById('previous-routine-banner').classList.add('hidden');
            saveRoutine();
            renderRoutine();
        }

        function updateRoutineData(index, field, value) {
            routine[index][field] = value;
            saveRoutine();
        }

        function removeFromRoutine(index) {
            routine.splice(index, 1);
            saveRoutine();
        }

        // Completar ejercicio con animación
        function completeExercise(index, btnElement) {
            // Encontrar la tarjeta del ejercicio
            const row = btnElement.closest('.bg-white');
            
            // Añadir la clase de animación espectacular
            row.classList.add('complete-anim');
            
            // Esperar a que acabe la animación (500ms) para borrarlo y mostrar el mensaje
            setTimeout(() => {
                routine.splice(index, 1);
                saveRoutine(); // Esto re-renderiza la lista automáticamente
                showMotivationalToast();
            }, 500);
        }

        // Mostrar notificación flotante
        function showMotivationalToast() {
            const container = document.getElementById('toast-container');
            const msgs = translations[currentLang].motivational;
            // Seleccionar un mensaje al azar
            const randomMsg = msgs[Math.floor(Math.random() * msgs.length)];
            
            const toast = document.createElement('div');
            toast.className = "bg-pandaDark dark:bg-pandaLight text-white dark:text-pandaDark px-6 py-3 rounded-full font-bold shadow-2xl text-sm md:text-base toast-anim border-2 border-pandaGreen flex items-center gap-2";
            toast.innerHTML = `
                <svg class="w-6 h-6 text-pandaGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                <span>${randomMsg}</span>
            `;
            
            container.appendChild(toast);
            
            // Destruir el elemento del DOM tras terminar su animación (3.5 segundos)
            setTimeout(() => {
                toast.remove();
            }, 3500);
        }

        // Exportar rutina a JSON
        function exportRoutine() {
            if(routine.length === 0) return alert(currentLang === 'es' ? 'La rutina está vacía' : 'Routine is empty');
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(routine));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "PandaTrainer_Rutina.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // Importar rutina desde JSON
        function importRoutine() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.readAsText(file, 'UTF-8');
                reader.onload = readerEvent => {
                    try {
                        const content = readerEvent.target.result;
                        routine = JSON.parse(content);
                        saveRoutine();
                        renderRoutine();
                        document.getElementById('previous-routine-banner').classList.add('hidden');
                        alert(currentLang === 'es' ? 'Rutina importada con éxito' : 'Routine imported successfully');
                    } catch (err) {
                        alert(currentLang === 'es' ? 'Error al leer el archivo. Asegúrate de que es un archivo JSON válido.' : 'Error reading file. Make sure it is a valid JSON file.');
                    }
                }
            }
            input.click();
        }

        function renderRoutine() {
            const container = document.getElementById('routine-list');
            const emptyState = document.getElementById('empty-routine');
            const prevBanner = document.getElementById('previous-routine-banner');
            container.innerHTML = '';

            // Mostrar banner de carga si está vacía pero hay datos en localStorage
            if (routine.length === 0 && savedRoutine.length > 0) {
                prevBanner.classList.remove('hidden');
            } else {
                prevBanner.classList.add('hidden');
            }

            if (routine.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const t = translations[currentLang];

            routine.forEach((item, index) => {
                const exName = currentLang === 'es' ? item.es : item.en;
                const catNames = Array.isArray(item.cat) 
                    ? item.cat.map(cId => categories.find(c => c.id === cId)[currentLang]).join(', ')
                    : categories.find(c => c.id === item.cat)[currentLang];

                const row = document.createElement('div');
                row.className = "bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 mb-3 transition-all duration-300 transform origin-left";
                
                let controlsHtml = '';
                if (item.isCardio) {
                    controlsHtml = `
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">${t.mins}</label>
                                <div class="flex items-center border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden bg-gray-50 dark:bg-gray-900">
                                    <button onclick="updateRoutineData(${index}, 'mins', Math.max(1, ${item.mins || 15} - 1))" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold dark:text-white">-</button>
                                    <input type="number" value="${item.mins || 15}" readonly class="w-full text-center bg-transparent text-pandaDark dark:text-white font-bold outline-none">
                                    <button onclick="updateRoutineData(${index}, 'mins', ${item.mins || 15} + 1)" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold dark:text-white">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    const sets = item.sets || 3;
                    const reps = item.reps || 12;
                    controlsHtml = `
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">${t.sets}</label>
                                <div class="flex items-center border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden bg-gray-50 dark:bg-gray-900">
                                    <button onclick="updateRoutineData(${index}, 'sets', Math.max(1, ${sets - 1}))" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold dark:text-white">-</button>
                                    <input type="number" value="${sets}" readonly class="w-full text-center bg-transparent text-pandaDark dark:text-white font-bold outline-none">
                                    <button onclick="updateRoutineData(${index}, 'sets', ${sets + 1})" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold dark:text-white">+</button>
                                </div>
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">${t.reps}</label>
                                <div class="flex items-center border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden bg-gray-50 dark:bg-gray-900">
                                    <button onclick="updateRoutineData(${index}, 'reps', Math.max(1, ${reps - 1}))" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold dark:text-white">-</button>
                                    <input type="number" value="${reps}" readonly class="w-full text-center bg-transparent text-pandaDark dark:text-white font-bold outline-none">
                                    <button onclick="updateRoutineData(${index}, 'reps', ${reps + 1})" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold dark:text-white">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="flex justify-between items-start mb-3 border-b border-gray-100 dark:border-gray-700 pb-2">
                        <div>
                            <h4 class="font-bold text-pandaDark dark:text-white text-sm pr-2">${exName}</h4>
                            <span class="text-xs text-pandaGreen">${catNames}</span>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <!-- Botón Completar (Tic Verde) -->
                            <button onclick="completeExercise(${index}, this)" class="bg-pandaLight dark:bg-gray-700 text-pandaGreen hover:bg-pandaGreen hover:text-white transition-colors p-1.5 rounded-full shadow-sm" title="${t.complete}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                            <!-- Botón Eliminar (Papelera/X) -->
                            <button onclick="removeFromRoutine(${index})" class="text-red-400 hover:text-red-600 transition-colors p-1" title="${t.remove}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    ${controlsHtml}
                `;
                container.appendChild(row);
            });
        }

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', () => {
            // Mostrar los iconos correctos según el modo oscuro actual
            if (document.documentElement.classList.contains('dark')) {
                document.getElementById('icon-sun').classList.remove('hidden');
            } else {
                document.getElementById('icon-moon').classList.remove('hidden');
            }

            renderFilters();
            renderExercises();
            
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') closeModal();
            });
        });

    </script>
</body>
</html>
