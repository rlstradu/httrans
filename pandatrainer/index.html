<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PandaTrainer</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pandaGreen: '#51a200',
                        pandaDark: '#373737',
                        pandaLight: '#f9fafb',
                    }
                }
            }
        }
    </script>
    <style>
        /* Ocultar barra de desplazamiento para las categorías */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animación suave para el Modal */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 text-pandaDark font-sans antialiased">

    <!-- Contenedor Principal estilo App Móvil y PC -->

            </div>

                    <svg id="icon-pc" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </button>

                <!-- Botón de Idioma (ES | EN) -->
                <div class="flex items-center text-sm font-bold">
                    <button id="lang-es" onclick="setLang('es')" class="text-pandaGreen hover:scale-110 transition-transform">ES</button>
                    <span class="mx-1 text-gray-300">|</span>
                    <button id="lang-en" onclick="setLang('en')" class="text-gray-400 hover:scale-110 transition-transform">EN</button>
                </div>
            </div>
        </header>

        <!-- Navegación de Pestañas -->

                <span data-lang="en" class="hidden">Exercises</span>
            </button>
            <button id="tab-routine" class="flex-1 py-3 text-center font-semibold text-gray-500 border-b-2 border-transparent transition-colors" onclick="switchTab('routine')">
                <span data-lang="es">Mi Rutina</span>
                <span data-lang="en" class="hidden">My Routine</span>
            </button>
        </nav>

        <!-- Pestaña: EJERCICIOS -->

            <!-- Filtro de Categorías -->
            <div class="bg-pandaLight border-b border-gray-200 relative flex items-center overflow-hidden">
                <!-- Botón Izquierda -->

                    <div class="bg-white rounded-full shadow-md p-1 ml-1 border border-gray-100">

                </button>

                </div>

                <!-- Los ejercicios se inyectan aquí -->
            </div>
        </main>

        <!-- Pestaña: MI RUTINA -->

            <div id="routine-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4 transition-all duration-300">
                <!-- Los items de rutina se inyectan aquí -->
            </div>
            
            <!-- Estado vacío -->
            <div id="empty-routine" class="text-center mt-10 text-gray-400 hidden">
                <svg class="w-16 h-16 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>

    <!-- MODAL POPUP (Oculto por defecto) -->

        // FUNCIÓN PARA GENERAR LA RUTA EXACTA DEL MEDIO (Sin paréntesis)
        function getMediaUrl(filename) {
            const baseUrl = "https://jugandoatraducir.com/wp-content/uploads/2026/05/";
            // Reemplaza los espacios por guiones y elimina todos los paréntesis
            let formattedName = filename.replace(/\s+/g, '-');
            formattedName = formattedName.replace(/[()]/g, '');
            return baseUrl + formattedName;
        }

        // FUNCIÓN PARA ALTERNAR LA VISTA (MÓVIL / PC)
        function toggleViewMode() {
            isMobileViewForce = !isMobileViewForce;
            const container = document.getElementById('app-container');
            const exList = document.getElementById('exercises-list');
            const roList = document.getElementById('routine-list');
            const iconMobile = document.getElementById('icon-mobile');
            const iconPc = document.getElementById('icon-pc');

            if (isMobileViewForce) {
                // Forzar vista móvil
                container.classList.remove('max-w-5xl');
                container.classList.add('max-w-md');
                
                exList.classList.remove('md:grid-cols-2', 'lg:grid-cols-3');
                roList.classList.remove('lg:grid-cols-2');
                
                iconPc.classList.add('hidden');
                iconMobile.classList.remove('hidden');
            } else {
                // Vista PC (Responsive normal)
                container.classList.remove('max-w-md');
                container.classList.add('max-w-5xl');
                
                exList.classList.add('md:grid-cols-2', 'lg:grid-cols-3');
                roList.classList.add('lg:grid-cols-2');
                
                iconMobile.classList.add('hidden');
                iconPc.classList.remove('hidden');
            }
        }

        // CONTROL DE IDIOMA
        function setLang(lang) {
            currentLang = lang;
            
            // Actualizar estilos de los botones ES/EN
            const btnEs = document.getElementById('lang-es');
            const btnEn = document.getElementById('lang-en');
            
            if (lang === 'es') {
                btnEs.className = "text-pandaGreen hover:scale-110 transition-transform";
                btnEn.className = "text-gray-400 hover:scale-110 transition-transform";
            } else {
                btnEn.className = "text-pandaGreen hover:scale-110 transition-transform";
                btnEs.className = "text-gray-400 hover:scale-110 transition-transform";
            }
            
            // Alternar visibilidad de los spans según el idioma
            document.querySelectorAll('[data-lang]').forEach(el => {
                if (el.getAttribute('data-lang') === currentLang) {
                    if (el.tagName === 'SPAN') {
                        el.classList.remove('hidden'); 
                    } else {
                        el.classList.remove('hidden');
                    }
                } else {
                    el.classList.add('hidden');
                }
            });

            // Re-renderizar las vistas dinámicas
            renderFilters();
            renderExercises();
            renderRoutine();
        }

        // CAMBIO DE PESTAÑAS (Ejercicios vs Rutina)
        function switchTab(tab) {
            const btnEx = document.getElementById('tab-exercises');
            const btnRo = document.getElementById('tab-routine');
            const viewEx = document.getElementById('view-exercises');
            const viewRo = document.getElementById('view-routine');

            if (tab === 'exercises') {
                btnEx.classList.add('text-pandaGreen', 'border-pandaGreen');
                btnEx.classList.remove('text-gray-500', 'border-transparent');
                btnRo.classList.add('text-gray-500', 'border-transparent');
                btnRo.classList.remove('text-pandaGreen', 'border-pandaGreen');
                viewEx.classList.remove('hidden');
                viewRo.classList.add('hidden');
            } else {
                btnRo.classList.add('text-pandaGreen', 'border-pandaGreen');
                btnRo.classList.remove('text-gray-500', 'border-transparent');
                btnEx.classList.add('text-gray-500', 'border-transparent');
                btnEx.classList.remove('text-pandaGreen', 'border-pandaGreen');
                viewRo.classList.remove('hidden');
                viewEx.classList.add('hidden');
                renderRoutine();
            }
        }

        // RENDERIZAR FILTROS DE CATEGORÍAS
        function renderFilters() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '';

            categories.forEach(cat => {
                const isSelected = currentCategory === cat.id;
                const btn = document.createElement('button');
                
                // Estilos dinámicos del botón
                btn.className = `whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${
                    isSelected ? 'bg-pandaGreen text-white shadow-md' : 'bg-white text-pandaDark border border-gray-200'
                }`;
                btn.innerText = currentLang === 'es' ? cat.es : cat.en;
                
                btn.onclick = () => {
                    currentCategory = cat.id;
                    renderFilters(); // Re-pintar para actualizar colores
                    renderExercises(); // Re-pintar lista
                };
                
                container.appendChild(btn);
            });
        }

        // RENDERIZAR LISTA DE EJERCICIOS
        function renderExercises() {
            const container = document.getElementById('exercises-list');
            container.innerHTML = '';

            const filteredDb = currentCategory === 'All' 
                ? db 
                : db.filter(ex => ex.cat.includes(currentCategory));

            if (filteredDb.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 mt-6 col-span-full">${currentLang === 'es' ? 'No hay ejercicios en esta categoría aún.' : 'No exercises in this category yet.'}</p>`;
                return;
            }

            filteredDb.forEach(ex => {
                // Obtener nombres de todas las categorías a las que pertenece el ejercicio
                const catNames = ex.cat.map(cId => categories.find(c => c.id === cId)[currentLang]).join(', ');
                const exName = currentLang === 'es' ? ex.es : ex.en;
                // Soporte universal para imágenes: si no es .mp4, lo tratamos como imagen (.jpg, .gif, etc)
                const isImg = !ex.file.toLowerCase().endsWith('.mp4');

                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition-shadow cursor-pointer";
                card.onclick = () => openModal(ex.id);

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 flex-shrink-0 rounded-lg bg-gray-100 flex items-center justify-center text-pandaGreen overflow-hidden">
                            ${isImg 
                                ? `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`
                                : `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>`
                            }
                        </div>
                        <div>
                            <h4 class="font-bold text-pandaDark text-sm leading-tight">${exName}</h4>
                            <span class="text-xs text-pandaGreen font-semibold">${catNames}</span>
                        </div>
                    </div>
                    <button class="w-8 h-8 rounded-full bg-pandaLight flex items-center justify-center text-pandaDark hover:bg-pandaGreen hover:text-white transition-colors flex-shrink-0" onclick="event.stopPropagation(); addToRoutine(${ex.id})">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // FUNCIONALIDAD DEL MODAL
        function openModal(id) {
            const ex = db.find(e => e.id === id);
            if (!ex) return;

            const modal = document.getElementById('modal');
            const mediaContainer = document.getElementById('modal-media');
            const title = document.getElementById('modal-title');
            const cat = document.getElementById('modal-category');
            const addBtn = document.getElementById('modal-add-btn');

            // Textos
            title.innerText = currentLang === 'es' ? ex.es : ex.en;
            cat.innerText = ex.cat.map(cId => categories.find(c => c.id === cId)[currentLang]).join(', ');

            // Media
            const mediaUrl = getMediaUrl(ex.file);
            mediaContainer.innerHTML = ''; // Limpiar anterior
            
            if (ex.file.toLowerCase().endsWith('.mp4')) {
                const video = document.createElement('video');
                video.src = mediaUrl;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.className = "w-full h-full object-contain";
                mediaContainer.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = mediaUrl;
                img.className = "w-full h-full object-contain";
                mediaContainer.appendChild(img);
            }

            // Configurar el botón de añadir
            addBtn.onclick = () => {
                addToRoutine(ex.id);
                closeModal();
            };

            // Mostrar modal
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            // Limpiar media para que el video pare
            document.getElementById('modal-media').innerHTML = ''; 
        }

        // FUNCIONALIDAD DE SCROLL HORIZONTAL DE CATEGORÍAS
        function scrollCategories(direction) {
            const container = document.getElementById('category-filters');
            const scrollAmount = 180; // Cantidad de píxeles que avanza con cada toque
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        // CREADOR DE RUTINA
        function addToRoutine(id) {
            const ex = db.find(e => e.id === id);
            
            let routineItem = { ...ex };
            
            // Lógica condicional: si es cardio añade minutos, si no, series/reps
            if (ex.isCardio) {
                routineItem.mins = 15;
            } else {
                routineItem.sets = 3;
                routineItem.reps = 12;
            }
            
            routine.push(routineItem);
            saveRoutine();
            
            // Pequeño feedback visual
            alert(currentLang === 'es' ? 'Añadido a tu rutina' : 'Added to your routine');
        }

        function saveRoutine() {
            localStorage.setItem('pandaTrainerRoutine', JSON.stringify(routine));
            if (document.getElementById('view-routine').classList.contains('hidden') === false) {
                renderRoutine();
            }
        }

        function updateRoutineData(index, field, value) {
            routine[index][field] = value;
            saveRoutine();
        }

        function removeFromRoutine(index) {
            routine.splice(index, 1);
            saveRoutine();
        }

        function renderRoutine() {
            const container = document.getElementById('routine-list');
            const emptyState = document.getElementById('empty-routine');
            container.innerHTML = '';

            if (routine.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const t = translations[currentLang];

            routine.forEach((item, index) => {
                const exName = currentLang === 'es' ? item.es : item.en;
                // Extraer los nombres de las categorías si existen, si no, mantener compatibilidad con localStorage antiguo
                const catNames = Array.isArray(item.cat) 
                    ? item.cat.map(cId => categories.find(c => c.id === cId)[currentLang]).join(', ')
                    : categories.find(c => c.id === item.cat)[currentLang];

                const row = document.createElement('div');
                row.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3";
                
                // Lógica de visualización dependiendo de si es cardio o fuerza
                let controlsHtml = '';
                if (item.isCardio) {
                    controlsHtml = `
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-gray-500 mb-1">${t.mins}</label>
                                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden bg-gray-50">
                                    <button onclick="updateRoutineData(${index}, 'mins', Math.max(1, ${item.mins || 15} - 1))" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 font-bold">-</button>
                                    <input type="number" value="${item.mins || 15}" readonly class="w-full text-center bg-transparent text-pandaDark font-bold outline-none">
                                    <button onclick="updateRoutineData(${index}, 'mins', ${item.mins || 15} + 1)" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 font-bold">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    const sets = item.sets || 3;
                    const reps = item.reps || 12;
                    controlsHtml = `
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-gray-500 mb-1">${t.sets}</label>
                                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden bg-gray-50">
                                    <button onclick="updateRoutineData(${index}, 'sets', Math.max(1, ${sets - 1}))" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 font-bold">-</button>
                                    <input type="number" value="${sets}" readonly class="w-full text-center bg-transparent text-pandaDark font-bold outline-none">
                                    <button onclick="updateRoutineData(${index}, 'sets', ${sets + 1})" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 font-bold">+</button>
                                </div>
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-gray-500 mb-1">${t.reps}</label>
                                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden bg-gray-50">
                                    <button onclick="updateRoutineData(${index}, 'reps', Math.max(1, ${reps - 1}))" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 font-bold">-</button>
                                    <input type="number" value="${reps}" readonly class="w-full text-center bg-transparent text-pandaDark font-bold outline-none">
                                    <button onclick="updateRoutineData(${index}, 'reps', ${reps + 1})" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 font-bold">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="flex justify-between items-start mb-3 border-b border-gray-100 pb-2">
                        <div>
                            <h4 class="font-bold text-pandaDark text-sm">${exName}</h4>
                            <span class="text-xs text-pandaGreen">${catNames}</span>
                        </div>
                        <button onclick="removeFromRoutine(${index})" class="text-red-400 hover:text-red-600 text-xs flex items-center gap-1 font-medium transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    ${controlsHtml}
                `;
                container.appendChild(row);
            });
        }

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderExercises();
            
            // Cerrar modal al hacer clic fuera del contenido
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') closeModal();
            });
        });

    </script>
</body>
</html>
