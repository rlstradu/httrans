<!DOCTYPE html>
<!--
  ============================================================================
  ARCHIVO GENERADO — NO EDITAR A MANO
  ============================================================================
  Este archivo lo crea "npm run build" a partir de poanda/src/.
  Cualquier cambio que escribas aquí se perderá en la siguiente compilación.
  Edita poanda/src/index.html y vuelve a compilar.
  ============================================================================
-->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Poanda</title>
    <meta name="description" content="Poanda — editor de archivos PO, JSON y HTML con glosario TBX, memoria de traducción TMX y compilación a MO. Una herramienta de PandaTools by HTTrans.">
    <link rel="icon" type="image/png" href="/images/favicon-poanda.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff@5.0.0/dist/diff.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-CsI3O6XE.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-vqxNrTVM.css">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-start min-h-screen">
    
    <div class="bg-white p-8 w-full relative min-h-screen" id="dropArea">
        <!-- Top Utility Buttons -->
        <div class="top-utility-buttons-container">
            <div class="dropdown">
                <button id="projectBtn" class="dropdown-btn font-medium py-1 px-3 rounded-md shadow-sm transition duration-300">
                    <span data-i18n="project_btn">Project</span>
                </button>
                <div class="dropdown-content">
                    <a id="newProjectBtn" data-i18n="new_project_btn">New Project</a>
                    <a id="openProjectBtn" data-i18n="open_project_btn">Open Project</a>
                    <a id="recentProjectsBtn" data-i18n="recent_projects_menu">Recent Projects</a>
                    <hr class="my-1 border-gray-200">
                    <a id="saveProjectBtn" data-i18n="save_project_btn">Save Project</a>
                </div>
            </div>
            <div class="dropdown">
            <button id="fileBtn" class="dropdown-btn font-medium py-1 px-3 rounded-md shadow-sm transition duration-300">
                <span data-i18n="file_menu_btn">File</span>
            </button>
            <div class="dropdown-content">

                <a id="loadFileBtn" data-i18n="load_file_menu">Load file</a>
                <a id="saveFileBtn" data-i18n="save_file_menu" class="disabled-link">Save file</a>
                <hr class="my-1 border-gray-200" id="convertMoSeparator">
                <a id="convertFileMoBtn" data-i18n="convert_mo_menu">Convert to .mo</a>
                <hr class="my-1 border-gray-200">
                <!-- El punto verde avisa de que hay copia guardada; va en la
                     propia entrada del menú, y se ve al desplegarlo. -->
                <a id="backupBtn"><span data-i18n="backup_btn">Backup</span><span id="backupIndicator"></span></a>
            </div>
        </div>
            <div class="dropdown">
                <button id="toolsBtn" class="dropdown-btn font-medium py-1 px-3 rounded-md shadow-sm transition duration-300">
                    <span data-i18n="tools_menu_btn">Tools</span>
                </button>
                <div class="dropdown-content">
                    <a id="undoBtn" data-i18n="undo_btn">Undo</a>
                    <hr class="my-1 border-gray-200">
                    <!-- Pretraducir con IA se fue al panel del asistente, que es
                         donde está todo lo demás de la IA (y donde se configura
                         el servicio del que depende). -->
                    <a id="findReplaceBtn" data-i18n="find_replace_btn">Find &amp; Replace</a>
                    <a id="shortcutsBtn" data-i18n="shortcuts_btn">Shortcuts</a>
                    <a id="statsBtn" data-i18n="statistics_btn">Statistics</a>
                </div>
            </div>

            <!-- La memoria y el glosario ya no se abren y se cierran cada uno
                 por su lado: están siempre a la vista en la columna de la
                 derecha. Lo único que queda aquí es esconder esa columna cuando
                 hace falta ancho para traducir. -->
            <button id="panelesBtn" class="font-medium py-1 px-3 rounded-md shadow-sm transition duration-300">
                <span data-i18n="panels_btn"></span>
            </button>
            <button id="aiBtn" class="font-medium py-1 px-3 rounded-md shadow-sm transition duration-300 flex items-center gap-1">
                <span>🐼</span> <span data-i18n="ai_btn">AI Assistant</span>
            </button>

            <!-- Logo reducido: solo se ve cuando hay un archivo abierto, para
                 no ocupar pantalla con la cabecera grande mientras se traduce -->
            <img id="logoPequeno" class="top-utility-left" src="/poanda-logo-final-v1.png" alt="Poanda">

            <!-- Idioma, tema y versión: separados del resto y pegados a la
                 derecha. Los tres llevan la misma clase y se ven iguales: son
                 tres controles del mismo rango y antes cada uno tenía su forma
                 (un menú, un emoji redondo y una etiqueta gris). -->
            <div class="top-utility-right">
                <div class="dropdown selector-idioma">
                    <button id="langBtn" class="dropdown-btn control-barra">
                        <span id="langActual">English</span>
                    </button>
                    <div class="dropdown-content dropdown-a-la-derecha">
                        <a id="langEnBtn" lang="en">English</a>
                        <a id="langEsBtn" lang="es">Español</a>
                    </div>
                </div>
                <!-- El texto del botón de tema lo pone theme.js: depende del
                     modo activo, no solo del idioma. -->
                <button id="darkModeToggle" class="control-barra">Dark mode</button>
                <button id="versionToggle" class="control-barra" data-i18n-title="changelog_btn_title">v2.1.0</button>
            </div>
        </div>

        <div id="cabeceraGrande" class="flex flex-col items-center mb-6 mt-12">
            <img src="/poanda-logo-final-v1.png" alt="Poanda Logo" class="max-w-xs h-auto mb-2">
            <div data-i18n="tool_description" id="toolDescription" class="text-lg text-center text-on-light-contrast"></div>
        </div>

        <!-- Campos de archivo ocultos: los usan el menú y el recuadro de arrastrar -->
        <input type="file" id="anyFile" accept=".po,.json,.html,.htm" class="hidden">
        <input type="file" id="projectFile" accept=".zip,.poanda" class="hidden">
        <input type="file" id="backupFile" accept=".json,.poanda-backup" class="hidden">
        <input type="file" id="jsonSourceFile" accept=".json" class="hidden">
        <input type="file" id="jsonTargetFile" accept=".json" class="hidden">
        <input type="file" id="htmlSourceFile" accept=".html,.htm" class="hidden">

        <div class="main-editor-layout" id="mainEditorLayout">
            <!-- Central Column Wrapper -->
            <div id="central-column" class="flex-1 flex flex-col min-w-0">
                <!-- PO Editor Search Bar -->
                <div id="poSearchContainer" class="mb-4 bg-gray-50 rounded-lg border border-gray-200 hidden">
                    <div class="flex items-center gap-2">
                        <input type="text" id="poSearchInput" data-i18n-placeholder="po_search_placeholder" class="border border-gray-300 rounded-md shadow-sm text-black bg-white">
                        <button id="searchPrevBtn" class="p-1 rounded-md hover:bg-gray-200 disabled:opacity-50" disabled>
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                        </button>
                        <button id="searchNextBtn" class="p-1 rounded-md hover:bg-gray-200 disabled:opacity-50" disabled>
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                        </button>
                        <span id="searchResultCounter" class="text-sm text-gray-600 whitespace-nowrap">0 / 0</span>

                        <!-- El par de idiomas del proyecto, al final de la barra
                             de búsqueda. Aquí está donde se traduce y no entre
                             los menús, que es otro rango: aquéllos son cosas que
                             se pulsan, esto es un dato del archivo que se mira.
                             Va detrás de una raya y con su propio título, para
                             que se lea como algo aparte de la búsqueda y no como
                             el final de ella. Al pulsarlo se cambia. -->
                        <span class="separador-barra" aria-hidden="true"></span>
                        <button id="parIdiomasBtn" class="par-idiomas" data-i18n-title="lang_pair_title"><span class="par-idiomas-titulo" data-i18n="lang_pair_label"></span><span id="parIdiomasValor" class="par-idiomas-valor">— → —</span></button>
                    </div>
                    
                    <div class="flex flex-wrap items-center gap-4 text-sm text-gray-600 mt-2">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="searchInOriginalCheckbox" checked class="mr-2">
                            <span data-i18n="search_in_original">Search in original</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="searchInTranslationCheckbox" checked class="mr-2">
                            <span data-i18n="search_in_translation">Search in translation</span>
                        </label>
                        
                        <div class="hidden sm:block w-px h-4 bg-gray-300 mx-2"></div>
                        
                        <label class="flex items-center cursor-pointer select-none" title="Automatically translate identical segments">
                            <input type="checkbox" id="autoPropagateCheckbox" class="mr-2">
                            <span data-i18n="auto_propagate_label">Auto-propagate translations</span>
                        </label>
                    </div>
                </div>
                <!-- Scrolling Content Area -->
                <div class="translations-container-scrolling pr-2">
                    <div id="translationsContainer" class="space-y-4">
                        <div id="initialMessage" class="zona-soltar">
                            <div class="zona-soltar-icono">📄</div>
                            <p class="zona-soltar-titulo" data-i18n="drop_zone_title"></p>
                            <p class="zona-soltar-texto" data-i18n="drop_zone_subtitle"></p>
                            <div class="zona-soltar-formatos">
                                <span class="formato">.po</span>
                                <span class="formato">.json</span>
                                <span class="formato">.html</span>
                                <span class="formato formato-proyecto">.poanda</span>
                            </div>
                            <p class="zona-soltar-privacidad" data-i18n="drop_zone_privacy"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- El asistente: una columna más, entre el editor y los paneles
                 de consulta. Antes flotaba por encima del texto, que es lo
                 último que uno quiere tapar mientras traduce. -->
            <div id="aiSidebar" class="ai-sidebar shadow-xl">
                <div class="sidebar-header p-3 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                    <h3 class="text-md font-bold text-gray-700 flex items-center gap-2">🐼 PandaBot AI</h3>
                    <div class="flex items-center gap-2">
                        <button id="aiConfigToggleBtn" class="text-gray-500 hover:text-gray-700" data-i18n-title="ai_config_title" title="Configurar API">⚙️</button>
                        <button id="closeAiSidebarBtn" class="text-gray-500 hover:text-gray-700">✕</button>
                    </div>
                </div>

                <!-- Ajustes de la IA: qué servicio, con qué modelo y con qué clave.
                     El campo de la dirección solo aparece con "compatible con OpenAI",
                     que es por donde entran Ollama, LM Studio y llama-server. -->
                <div id="aiConfigPanel" class="ai-config-panel hidden">
                    <!-- Estado "conectado": lo primero que se ve cuando ya hay
                         servicio y clave. Enseña a qué está conectado, deja
                         cambiar de modelo sin volver a conectar y lleva a
                         cambiar de servicio con un botón. -->
                    <div id="aiConectado" class="hidden">
                        <p class="ia-conectado"><span class="ia-conectado-punto" aria-hidden="true"></span><span id="aiConectadoServicio"></span></p>

                        <label class="ia-etiqueta" data-i18n="ai_modelo_label">Modelo</label>
                        <select id="aiModelo" class="ia-campo"></select>
                        <p class="ia-pista" data-i18n="ai_modelo_pista"></p>

                        <label class="ia-etiqueta" data-i18n="ai_instrucciones_label">Instrucciones para este proyecto</label>
                        <textarea id="aiInstrucciones" class="ia-campo" rows="2" data-i18n-placeholder="ai_instrucciones_pista"></textarea>

                        <div class="flex justify-end gap-2 mt-2">
                            <button id="aiCambiarBtn" class="px-2 py-1 rounded text-xs btn-modal-neutral" data-i18n="ai_cambiar_servicio">Cambiar de servicio</button>
                            <button id="aiGuardarModeloBtn" class="px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600" data-i18n="save_button">Guardar</button>
                        </div>
                    </div>

                    <!-- Estado "sin conectar": elegir servicio y pegar la clave.
                         El campo de la dirección solo aparece con "compatible con
                         OpenAI", que es por donde entran Ollama, LM Studio y
                         llama-server; y ahí no se pide clave, porque no la hay. -->
                    <div id="aiSinConectar">
                        <label class="ia-etiqueta" data-i18n="ai_proveedor_label">Servicio de IA</label>
                        <select id="aiProveedor" class="ia-campo"></select>

                        <div id="aiUrlBloque" class="hidden">
                            <label class="ia-etiqueta" data-i18n="ai_url_label">Dirección del servicio</label>
                            <input type="text" id="aiBaseUrl" class="ia-campo" placeholder="http://127.0.0.1:11434/v1">
                            <p class="ia-pista" data-i18n="ai_url_pista"></p>
                        </div>

                        <div id="aiClaveBloque">
                            <label class="ia-etiqueta" data-i18n="ai_api_key_label">Clave de API</label>
                            <input type="password" id="aiClave" class="ia-campo" data-i18n-placeholder="ai_api_key_placeholder" placeholder="Pegar la clave aquí…">
                            <label class="ia-casilla"><input type="checkbox" id="aiRecordarClave"> <span data-i18n="ai_recordar_clave">Recordar en este ordenador</span></label>
                            <p class="ia-pista" data-i18n="ai_api_key_info"></p>
                        </div>

                        <div class="flex justify-end gap-2 mt-2">
                            <button id="aiConectarBtn" class="px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600" data-i18n="ai_conectar">Conectar y guardar</button>
                        </div>
                    </div>

                    <p id="aiEstadoConexion" class="ia-pista"></p>
                </div>

                <div class="ai-quick-actions">
                    <button id="aiQuickTranslate" class="ai-quick-btn" data-ai-action="translate" data-i18n="ai_quick_translate">Traducir</button>
                    <button class="ai-quick-btn" data-ai-action="improve" data-i18n="ai_quick_improve">Mejorar</button>
                    <button class="ai-quick-btn" data-ai-action="explain" data-i18n="ai_quick_explain">Explicar</button>
                    <button class="ai-quick-btn" data-ai-action="fix" data-i18n="ai_quick_fix">Corregir</button>
                </div>

                <!-- Pretraducir el archivo entero. Va aparte de los cuatro de
                     arriba a propósito: aquéllos tocan el segmento en el que
                     estás, y éste recorre todo el archivo. -->
                <div class="ai-accion-archivo">
                    <button id="pretraducirBtn" class="ai-btn-archivo" type="button" data-i18n="ai_pretraducir_btn">Pre-translate with AI</button>
                </div>

                <div id="aiChatContainer" class="ai-chat-container">
                    </div>

                <div class="ai-input-area">
                    <div class="flex gap-2">
                        <textarea id="aiUserInput" class="ai-textarea" data-i18n-placeholder="ai_input_placeholder" placeholder="Escribe tu consulta... (Enter para enviar)"></textarea>
                        <button id="aiSendBtn" class="bg-red-400 text-white px-3 rounded hover:bg-red-500">➤</button>
                    </div>
                </div>
            </div>

            <!-- Los paneles de consulta, en una columna a la derecha: la
                 memoria arriba y el glosario abajo. Flotando tapaban justo el
                 texto que hay que mirar para decidir si una coincidencia sirve,
                 y había que apartarlos a mano cada vez. -->
            <div id="panelesDerecha" class="paneles-derecha">
                <div id="tiradorAncho" class="tirador-ancho" role="separator" aria-orientation="vertical" data-i18n-title="panel_resize_width"></div>

                <!-- Un solo buscador para los dos paneles. Antes había uno en
                     cada uno, buscando lo mismo con dos campos y dos títulos:
                     dos franjas de una columna donde el sitio escasea. -->
                <div class="paneles-buscador">
                    <span class="paneles-buscador-lupa" aria-hidden="true"></span>
                    <input type="text" id="buscarPaneles" data-i18n-placeholder="panels_search_placeholder" class="ia-campo">
                </div>

                <div id="translationMemorySidebar" class="translation-memory-sidebar p-4 border border-gray-300 rounded-lg shadow-md">
                    <!-- Título, acciones y plegado en una sola fila: en media
                         columna, una cabecera de dos renglones es una fila de
                         coincidencias menos. -->
                    <div class="sidebar-header">
                        <h3 class="panel-titulo" data-i18n="tm_sidebar_title" id="tmSidebarTitle"></h3>
                        <div class="panel-acciones">
                            <label id="importTmxBtn" for="tmFileInput" class="panel-icono" data-i18n-title="import_tmx"><input type="file" id="tmFileInput" accept=".xml,.tmx" class="hidden" /></label>
                            <button id="downloadTmxBtn" class="panel-icono" data-i18n-title="download_tmx" type="button"></button>
                            <button id="closeTranslationMemorySidebarBtn" class="panel-icono panel-plegar" data-i18n-title="panel_collapse" type="button"></button>
                        </div>
                    </div>
                    <div class="sidebar-content">
                        <div id="tmInternalMessage" class="tm-info-box mb-4 hidden"></div>
                        <div id="tmEditorSection">
                            <button id="memoriaParIdiomas" class="par-del-proyecto" type="button" data-i18n-title="lang_pair_title"><span class="par-del-proyecto-icono" aria-hidden="true"></span><span class="par-del-proyecto-texto" id="memoriaParIdiomasTexto"></span></button>
                            <div id="tmResultados" class="hidden">
                                <h4 class="text-md font-semibold text-on-light-contrast mt-4 mb-2" data-i18n="tm_search_results_title" id="tmSearchResultsTitle"></h4>
                                <!-- Una tarjeta por coincidencia, no una tabla de
                                     tres columnas: en media columna, cada celda
                                     medía cien píxeles y el texto salía cortado
                                     cada dos palabras. -->
                                <div id="tmResultadosLista" class="tm-lista"></div>
                            </div>
                            <div data-i18n="tm_no_match_found" id="tmNoMatchFoundMessage" class="text-center text-gray-500 p-4 border border-gray-300 rounded-md hidden"></div>
                        </div>
                    </div>
            </div>
                <div id="tiradorReparto" class="tirador-reparto" role="separator" aria-orientation="horizontal" data-i18n-title="panel_resize_split"></div>
            <div id="terminologySidebar" class="terminology-sidebar p-4 border border-gray-300 rounded-lg shadow-md">
                <div class="sidebar-header">
                    <h3 class="panel-titulo" data-i18n="terminology_sidebar_title" id="terminologySidebarTitle"></h3>
                    <div class="panel-acciones">
                        <button id="addTermToggleBtn" class="panel-icono" data-i18n-title="add_term_title" type="button"></button>
                        <button id="importTbxBtn" class="panel-icono" data-i18n-title="import_tbx" type="button"></button>
                        <input type="file" id="tbxFileInput" accept=".xml,.tbx" class="hidden" />
                        <button id="downloadTbxBtn" class="panel-icono" data-i18n-title="download_tbx" type="button"></button>
                        <button id="closeTerminologySidebarBtn" class="panel-icono panel-plegar" data-i18n-title="panel_collapse" type="button"></button>
                    </div>
                </div>
                <div class="sidebar-content">
                    <div id="terminologyEditorSection">
                        <button id="glosarioParIdiomas" class="par-del-proyecto" type="button" data-i18n-title="lang_pair_title"><span class="par-del-proyecto-icono" aria-hidden="true"></span><span class="par-del-proyecto-texto" id="glosarioParIdiomasTexto"></span></button>
                        <!-- La ficha de un término se rellena en su propio cuadro
                             (#terminoModal, más abajo): son cinco campos, y en media
                             columna no caben sin comerse la lista de términos. -->
                        <div id="glosarioResultados" class="hidden">
                            <h4 class="text-md font-semibold text-on-light-contrast mt-4 mb-2" data-i18n="glossary_list_title" id="glossaryListTitle"></h4>
                            <div class="overflow-x-auto"><table class="glossary-table w-full"><thead><tr><th data-i18n="source_term_col" id="sourceTermCol"></th><th data-i18n="target_term_col" id="targetTermCol"></th><th data-i18n="actions_col" id="actionsCol"></th></tr></thead><tbody id="glossaryTableBody"></tbody></table></div>
                        </div>
                    </div>
                </div>
            </div>

                <!-- El aviso de que la memoria y el glosario están vacíos: va
                     debajo de los dos paneles, no dentro de ninguno, y lo dice
                     el panda en un bocadillo. Estaba arriba, en un recuadro
                     gris, entre el buscador y la memoria —justo donde uno mira
                     para trabajar—, y con una letra que encima no se leía. El
                     que ya sabe cómo va esto lo cierra con su equis y no
                     vuelve. -->
                <div id="panelesAviso" class="paneles-aviso hidden">
                    <img class="paneles-aviso-panda" src="/images/panda-glasses.png" alt="" aria-hidden="true">
                    <div class="paneles-aviso-bocadillo">
                        <p data-i18n="panels_vacios"></p>
                        <button id="panelesAvisoCerrar" class="paneles-aviso-cerrar" type="button" data-i18n-title="panels_notice_dismiss">&times;</button>
                    </div>
                </div>
            </div>

        </div>



        <div id="recentProjectsModal" class="modal hidden"><div class="modal-content"><h2 data-i18n="recent_projects_title" class="text-xl font-bold mb-2 text-on-light-contrast"></h2><p data-i18n="recent_projects_info" class="text-sm text-gray-600 mb-4"></p><div id="recentProjectsList" class="space-y-2 max-h-96 overflow-y-auto"></div><p id="recentProjectsEmpty" class="text-gray-500 text-sm hidden" data-i18n="recent_projects_empty"></p><div class="flex justify-end mt-6"><button id="recentProjectsCloseBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="close_btn"></span></button></div></div></div>

        <!-- Diálogos propios que sustituyen a confirm() y prompt() del navegador (AGENTS.md §5) -->
        <div id="confirmModal" class="modal hidden"><div class="modal-content"><p id="confirmModalText" class="text-lg font-semibold text-on-light-contrast mb-4"></p><div class="flex justify-end space-x-2 mt-6"><button id="confirmModalCancelBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="cancel_button"></span></button><button id="confirmModalOkBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="ok"></span></button></div></div></div>

        <div id="promptModal" class="modal hidden"><div class="modal-content"><p id="promptModalText" class="text-lg font-semibold text-on-light-contrast mb-4"></p><input type="text" id="promptModalInput" class="w-full border border-gray-300 rounded-md shadow-sm p-2 text-black bg-white"><div class="flex justify-end space-x-2 mt-6"><button id="promptModalCancelBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="cancel_button"></span></button><button id="promptModalOkBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="ok"></span></button></div></div></div>

        <div id="messageBox" class="modal hidden"><div class="modal-content"><p id="messageText" class="text-lg font-semibold text-on-light-contrast mb-4"></p><button id="messageClose" class="py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="ok" id="okBtnText"></span></button></div></div>

        <!-- Pretraducir el archivo entero. Los dos motores se explican en el
             propio cuadro, porque la diferencia entre ellos (rápido y sin
             criterio, o lento y con tu glosario) es justo lo que hay que
             decidir aquí. -->
        <!-- El par de idiomas del proyecto. Sale al abrir un archivo, ya
             relleno con lo que el archivo declare, y se puede volver a abrir
             desde el indicador de la barra. -->
        <div id="idiomasModal" class="modal hidden"><div class="modal-content"><h2 data-i18n="lang_pair_dialog_title" class="text-xl font-bold mb-2 text-on-light-contrast"></h2><p data-i18n="lang_pair_dialog_info" class="ia-pista mb-3"></p><p id="idiomasAviso" class="ia-pista idiomas-aviso hidden"></p><div class="idiomas-par"><div><label class="ia-etiqueta" for="idiomaOrigen" data-i18n="source_language"></label><select id="idiomaOrigen" class="ia-campo"></select></div><div class="idiomas-flecha" aria-hidden="true">&rarr;</div><div><label class="ia-etiqueta" for="idiomaDestino" data-i18n="target_language"></label><select id="idiomaDestino" class="ia-campo"></select></div></div><p id="idiomasError" class="idiomas-error"></p><div class="flex justify-end space-x-2 mt-4"><button id="idiomasCancelarBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="cancel_button"></span></button><button id="idiomasAceptarBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="accept_button"></span></button></div></div></div>
        <!-- La ficha de un término del glosario. El mismo cuadro sirve para
             crear y para corregir: pulsar una fila de la lista lo abre con los
             datos dentro y con el botón de borrar a la vista. Los campos son
             los de PandaTerm, para que un glosario pase de una herramienta a
             otra sin dejarse nada por el camino. -->
        <div id="terminoModal" class="modal hidden">
            <div class="modal-content">
                <h2 id="terminoModalTitulo" class="text-xl font-bold mb-3 text-on-light-contrast"></h2>
                <div class="termino-par">
                    <div>
                        <label class="ia-etiqueta" for="terminoOrigen"><span data-i18n="term"></span><span class="required-asterisk">*</span></label>
                        <input type="text" id="terminoOrigen" class="ia-campo" autocomplete="off">
                    </div>
                    <div>
                        <label class="ia-etiqueta" for="terminoDestino"><span data-i18n="translation"></span><span class="required-asterisk">*</span></label>
                        <input type="text" id="terminoDestino" class="ia-campo" autocomplete="off">
                    </div>
                </div>
                <label class="ia-etiqueta" for="terminoCategoria" data-i18n="part_of_speech"></label>
                <select id="terminoCategoria" class="ia-campo"></select>
                <label class="ia-etiqueta" for="terminoDefinicion" data-i18n="definition"></label>
                <textarea id="terminoDefinicion" class="ia-campo" rows="2"></textarea>
                <label class="ia-etiqueta" for="terminoNotas" data-i18n="notes"></label>
                <textarea id="terminoNotas" class="ia-campo" rows="2"></textarea>
                <p id="terminoError" class="idiomas-error"></p>
                <div class="termino-botones">
                    <button id="terminoBorrarBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-dark hidden"><span data-i18n="delete_button"></span></button>
                    <span class="termino-botones-hueco"></span>
                    <button id="terminoCancelarBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="cancel_button"></span></button>
                    <button id="terminoGuardarBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="save_button"></span></button>
                </div>
            </div>
        </div>

        <div id="pretraducirModal" class="modal hidden"><div class="modal-content"><h2 data-i18n="ai_pretraducir_titulo" class="text-xl font-bold mb-2 text-on-light-contrast"></h2><p data-i18n="ai_pretraducir_alcance" class="ia-pista mb-3"></p><div id="pretraducirMotores"><label class="ia-motor"><input type="radio" name="motorIA" value="rapido" checked> <span class="ia-motor-nombre" data-i18n="ai_motor_rapido"></span><span class="ia-motor-info" data-i18n="ai_motor_rapido_info"></span></label><label class="ia-motor"><input type="radio" name="motorIA" value="contexto"> <span class="ia-motor-nombre" data-i18n="ai_motor_contexto"></span><span class="ia-motor-info" data-i18n="ai_motor_contexto_info"></span></label></div><div id="pretraducirAvance" class="hidden"><div class="ia-barra"><div id="pretraducirBarra" class="ia-barra-avance"></div></div><p id="pretraducirEstado" class="ia-pista"></p></div><div class="flex justify-end space-x-2 mt-6"><button id="pretraducirCancelarBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="cancel_button"></span></button><button id="pretraducirEmpezarBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="ai_pretraducir_empezar"></span></button></div></div></div>

        <!-- Comentarios del segmento: arriba las notas que trae el archivo (no se
             tocan, son de quien lo escribió) y abajo la tuya, que se guarda en el
             proyecto y no se escribe en el archivo. -->
        
        <div id="shortcutsModal" class="modal hidden">
            <div class="modal-content">
                <h2 data-i18n="shortcuts_title" class="text-xl font-bold mb-4 text-on-light-contrast"></h2>
                <div id="shortcutsEditor" class="space-y-4">
                    <!-- Shortcut editor content will be generated here by JS -->
                </div>
                <div class="flex flex-wrap justify-end gap-2 mt-6">
                    <button id="importShortcutsBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-secondary"><span data-i18n="import_shortcuts_btn"></span></button>
                    <input type="file" id="importShortcutsInput" class="hidden" accept=".json">
                    <button id="exportShortcutsBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-secondary"><span data-i18n="export_shortcuts_btn"></span></button>
                    <button id="resetShortcutsBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-dark"><span data-i18n="reset_defaults_btn"></span></button>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button id="shortcutsCloseBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="cancel_button"></span></button>
                    <button id="saveShortcutsBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="save_button"></span></button>
                </div>
            </div>
        </div>

        <div id="findReplaceModal" class="modal hidden"><div class="modal-content"><h2 data-i18n="find_replace_title" id="findReplaceTitle" class="text-xl font-bold mb-4 text-on-light-contrast"></h2><div class="space-y-4"><div><label for="findInput" data-i18n="find_label" id="findLabel" class="block text-sm font-medium text-on-light-contrast mb-1"></label><input type="text" id="findInput" class="w-full border border-gray-300 rounded-md shadow-sm p-2 text-black bg-white"></div><div><label for="replaceInput" data-i18n="replace_label" id="replaceLabel" class="block text-sm font-medium text-on-light-contrast mb-1"></label><input type="text" id="replaceInput" class="w-full border border-gray-300 rounded-md shadow-sm p-2 text-black bg-white"></div><div class="flex items-center space-x-4"><label class="flex items-center text-on-light-contrast"><input type="checkbox" id="caseSensitiveCheckbox" class="mr-2"><span data-i18n="case_sensitive" id="caseSensitiveText"></span></label><label class="flex items-center text-on-light-contrast"><input type="checkbox" id="regexCheckbox" class="mr-2"><span data-i18n="regular_expression" id="regexText"></span></label></div><div class="flex justify-end space-x-2"><button data-i18n="find_prev" id="findPrevBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span id="findPrevText"></span></button><button data-i18n="find_next" id="findNextBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span id="findNextText"></span></button><button data-i18n="replace" id="replaceBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-secondary"><span id="replaceText"></span></button><button data-i18n="replace_all" id="replaceAllBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span id="replaceAllText"></span></button></div></div><button data-i18n="close_btn" id="findReplaceCloseBtn" class="mt-6 py-2 px-4 rounded-md transition duration-300 w-full btn-modal-dark"><span id="findReplaceCloseBtnText"></span></button></div></div>
        <div id="saveProjectModal" class="modal hidden"><div class="modal-content"><h2 data-i18n="save_project_title" id="saveProjectTitle" class="text-xl font-bold mb-4 text-on-light-contrast"></h2><div class="space-y-4"><div><label for="projectFilenameInput" data-i18n="filename_label" id="filenameLabel" class="block text-sm font-medium text-on-light-contrast mb-1"></label><input type="text" id="projectFilenameInput" class="w-full border border-gray-300 rounded-md shadow-sm p-2 text-black bg-white"></div></div><div class="flex justify-end space-x-2 mt-6"><button id="saveProjectCancelBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="cancel_button"></span></button><button id="saveProjectConfirmBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="save_button"></span></button></div></div></div>
        
        <div id="backupModal" class="modal hidden">
            <div class="modal-content">
                <h2 data-i18n="backup_title" class="text-xl font-bold mb-4 text-on-light-contrast"></h2>
                <p data-i18n="backup_info_text" class="text-on-light-contrast mb-4"></p>
                <div class="bg-gray-100 p-3 rounded-md mb-6">
                    <p class="text-sm text-gray-700"><strong data-i18n="last_backup_label"></strong> <span id="lastBackupTime"></span></p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button id="loadLocalBackupBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 disabled:opacity-50 btn-modal-primary" disabled><span data-i18n="load_local_backup_btn"></span></button>
                    <button id="saveBackupToDiskBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 disabled:opacity-50 btn-modal-secondary" disabled><span data-i18n="save_backup_to_disk_btn"></span></button>
                    <label class="font-medium py-2 px-4 rounded-md transition duration-300 cursor-pointer text-center btn-modal-secondary"><span data-i18n="load_backup_from_disk_btn"></span><input type="file" id="loadBackupFromFileInput" class="hidden" accept=".json,.poanda-backup"/></label>
                    <button id="deleteLocalBackupBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 disabled:opacity-50 btn-modal-dark" disabled><span data-i18n="delete_local_backup_btn"></span></button>
                </div>
                 <button id="backupCloseBtn" class="mt-6 py-2 px-4 rounded-md transition duration-300 w-full btn-modal-neutral"><span data-i18n="close_btn"></span></button>
            </div>
        </div>

        <div id="restoreBackupModal" class="modal hidden"><div class="modal-content"><h2 data-i18n="restore_backup_title" id="restoreBackupTitle" class="text-xl font-bold mb-4 text-on-light-contrast"></h2><p data-i18n="restore_backup_info" id="restoreBackupInfo" class="text-on-light-contrast mb-6"></p><div class="flex justify-end space-x-2"><button id="discardBackupBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="discard_button"></span></button><button id="restoreBackupBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="restore_button"></span></button></div></div></div>

        <div id="convertToMoModal" class="modal hidden">
            <div class="modal-content">
                <h2 data-i18n="mo_converter_title" class="text-xl font-bold mb-4 text-on-light-contrast"></h2>
                <p data-i18n="mo_converter_info" class="text-on-light-contrast mb-6"></p>
                <div class="flex justify-end space-x-2">
                    <button id="moConverterCloseBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-neutral"><span data-i18n="close_btn"></span></button>
                    <button id="moConverterActionBtn" class="font-medium py-2 px-4 rounded-md transition duration-300 btn-modal-primary"><span data-i18n="mo_converter_action_btn"></span></button>
                </div>
            </div>
        </div>
        
        <div id="changelogModal" class="modal hidden">
            <div class="modal-content" style="width: 750px; max-width: 95%;">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-on-light-contrast m-0">Changelog</h2>
                    <button id="changelogCloseBtn" class="text-gray-500 hover:text-gray-800 text-3xl font-bold leading-none cursor-pointer">&times;</button>
                </div>
                <div class="overflow-y-auto rounded-md" style="max-height: 60vh;">
                    <!-- Antes era un <pre> con el archivo tal cual. Ahora el
                         contenido llega ya con su estructura (títulos,
                         secciones y listas), así que necesita un contenedor
                         normal donde el texto pueda fluir. -->
                    <div id="changelogContent" class="changelog-cuerpo"></div>
                </div>
            </div>
        </div>
        </div>

    <div id="statsContainer" class="fixed bottom-0 left-0 right-0 bg-white p-3 border-t border-gray-200 shadow-lg z-[900]"><div class="max-w-7xl mx-auto text-sm text-center text-gray-700 flex flex-wrap justify-center md:justify-around items-center gap-x-6 gap-y-2"><p><strong class="font-semibold" data-i18n="stats_progress_label"></strong> <span id="segmentsProgress"></span></p><p><strong class="font-semibold" data-i18n="stats_words_label"></strong> <span id="wordsTranslated">0</span> / <span id="wordsTotal">0</span></p><p><strong class="font-semibold" data-i18n="stats_remaining_label"></strong> <span id="wordsRemaining">0</span></p></div></div>
    <div id="loadingOverlay" class="loading-overlay hidden"><div class="loading-spinner"></div><p id="loadingMessage"></p></div>

    <!-- La tarjeta que sale al pasar el ratón por un término resaltado. Vive
         suelta al final de la página, no dentro del segmento: dentro se la
         comería el recorte del texto original en cuanto asomara por el borde. -->
    <div id="terminoTarjeta" class="termino-tarjeta hidden" role="tooltip" aria-hidden="true"></div>
</body>
</html>
