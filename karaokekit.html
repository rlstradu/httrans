<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaraokeKIT</title>

<style>
:root{
    --primary:#ff3366;
    --bg:#0f1117;
    --panel:#1b1f2a;
    --text:#ffffff;
    --muted:#9ca3af;
    --active:#ffd700;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
}

header{
    background:#111827;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #222;
}

header img{
    width:60px;
    height:60px;
    object-fit:contain;
    border-radius:8px;
}

header h1{
    font-size:2rem;
}

.container{
    display:grid;
    grid-template-columns:350px 1fr;
    min-height:calc(100vh - 92px);
}

.sidebar{
    background:var(--panel);
    padding:20px;
    border-right:1px solid #333;
}

.sidebar h2{
    margin-bottom:15px;
}

.control{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:.9rem;
    color:#ddd;
}

select,input[type=range]{
    width:100%;
}

.song-list{
    width:100%;
    padding:10px;
    background:#111827;
    color:white;
    border:1px solid #444;
    border-radius:8px;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

.play{
    background:#16a34a;
    color:white;
}

.pause{
    background:#dc2626;
    color:white;
}

.jump{
    background:#374151;
    color:white;
}

.status{
    padding:15px;
    background:#111827;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.main{
    display:flex;
    flex-direction:column;
}

.progress{
    width:100%;
    height:8px;
    background:#333;
}

.progress-bar{
    height:100%;
    width:0%;
    background:var(--primary);
}

.karaoke{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
}

.lyrics{
    width:100%;
    max-width:1200px;
}

.line{
    margin:20px 0;
    opacity:.35;
    transition:.3s;
    line-height:1.3;
}

.line.active{
    opacity:1;
    color:var(--active);
    font-weight:bold;
    transform:scale(1.05);
}

.footer{
    padding:10px;
    text-align:center;
    color:#aaa;
    background:#111827;
}

@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<header>
    <img src="https://6a27ca5ac4e8bc00da7294bf--radiokit.netlify.app/logo_radiokit_2.jpeg" alt="RadioKIT">
    <h1>KaraokeKIT</h1>
</header>

<div class="container">

    <div class="sidebar">

        <h2>Configuración</h2>

        <div class="control">
            <label>Canción</label>
            <select id="songSelect" class="song-list">
                <option value="enough">I'm Enough (Sometimes)</option>
            </select>
        </div>

        <div class="control">
            <label>Líneas visibles</label>
            <select id="visibleLines">
                <option value="1">1 línea</option>
                <option value="2">2 líneas</option>
                <option value="3" selected>3 líneas</option>
                <option value="4">4 líneas</option>
            </select>
        </div>

        <div class="control">
            <label>Tamaño de letra</label>
            <input id="fontSize" type="range" min="24" max="90" value="52">
        </div>

        <div class="control">
            <label>Tiempo actual</label>
            <div id="currentTime">00:00</div>
        </div>

        <div class="buttons">
            <button class="play" onclick="playTeleprompter()">▶ Play</button>
            <button class="pause" onclick="pauseTeleprompter()">⏸ Pausa</button>
        </div>

        <br>

        <div class="buttons">
            <button class="jump" onclick="seek(-5)">⏪ -5s</button>
            <button class="jump" onclick="seek(5)">⏩ +5s</button>
            <button class="jump" onclick="restartSong()">⏮ Reiniciar</button>
        </div>

    </div>

    <div class="main">

        <div class="status">
            <div>Karaoke Mode</div>
            <div id="songTitle">I'm Enough (Sometimes)</div>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="karaoke">
            <div class="lyrics" id="lyrics"></div>
        </div>

        <div class="footer">
            KaraokeKIT
        </div>

    </div>

</div>

<script>

const songs = {

    enough: [

        {time:16,text:"I’m enough to be the hope when no one else believes."},
        {time:23,text:"Enough to feel my sound when others won’t."},
        {time:29,text:"Enough to hold the light that darkness never leaves."},
        {time:36,text:"Enough to walk alone beyond the drone."},

        {time:43,text:"I’m enough to be the voice when silence fills the room."},
        {time:50,text:"Enough to lose it all (and) still refuse to fall."},
        {time:57,text:"Enough to lose control but never lose my goal."},
        {time:63,text:"Enough to fight alone and reach the throne."},

        {time:69,text:"I fall, I rise, I climb."},
        {time:73,text:"I break, I heal, I fight."},
        {time:76,text:"I step outside the loops that run inside my mind."},
        {time:86,text:"Sometimes."},

        {time:93,text:"I’m enough to find the strength that others can’t achieve."},
        {time:100,text:"Enough to fight until I break the stone."},
        {time:107,text:"I’m enough to heal the pain (that) no one can relieve."},
        {time:113,text:"Enough to face the storm as wild winds blow."},

        {time:120,text:"I fall, I rise, I climb."},
        {time:123,text:"I break, I heal, I fight."},
        {time:127,text:"I step outside the loops that run inside my mind."},
        {time:131,text:"Sometimes."},
        {time:138,text:"Sometimes."},
        {time:145,text:"Sometimes."},

        {time:232,text:"I’m enough to be the hope when no one else believes."},
        {time:239,text:"Enough to feel my sound when others won’t."},
        {time:246,text:"Enough to hold the light that darkness never leaves."},
        {time:252,text:"Enough to walk alone beyond the drone."},

        {time:258,text:"I fall, I rise, I climb."},
        {time:262,text:"I break, I heal, I fight."},
        {time:265,text:"I step outside the loops that run inside my mind."},
        {time:275,text:"Sometimes."},
        {time:282,text:"Sometimes."},
        {time:289,text:"Sometimes."}
    ]
};

let currentSong = songs.enough;
let currentTime = 0;
let timer = null;
let playing = false;
let duration = 289;

function formatTime(sec){

    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);

    return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
}

function renderLyrics(){

    const visible = parseInt(document.getElementById("visibleLines").value);
    const fontSize = document.getElementById("fontSize").value;

    let currentIndex = 0;

    for(let i=0; i<currentSong.length; i++){
        if(currentSong[i].time <= currentTime){
            currentIndex = i;
        }
    }

    let html = "";

    for(let i=currentIndex; i<Math.min(currentIndex + visible, currentSong.length); i++){

        html += `
        <div
            class="line ${i===currentIndex ? 'active' : ''}"
            style="font-size:${fontSize}px">
            ${currentSong[i].text}
        </div>`;
    }

    document.getElementById("lyrics").innerHTML = html;
    document.getElementById("currentTime").textContent = formatTime(currentTime);

    document.getElementById("progressBar").style.width =
        ((currentTime / duration) * 100) + "%";
}

function tick(){

    currentTime += 0.1;

    if(currentTime >= duration){
        currentTime = duration;
        pauseTeleprompter();
    }

    renderLyrics();
}

function playTeleprompter(){

    if(playing) return;

    playing = true;
    timer = setInterval(tick,100);
}

function pauseTeleprompter(){

    playing = false;

    if(timer){
        clearInterval(timer);
        timer = null;
    }
}

function seek(seconds){

    currentTime += seconds;

    if(currentTime < 0){
        currentTime = 0;
    }

    if(currentTime > duration){
        currentTime = duration;
    }

    renderLyrics();
}

function restartSong(){

    currentTime = 0;

    renderLyrics();

    if(playing){
        clearInterval(timer);
        timer = setInterval(tick,100);
    }
}

document.getElementById("visibleLines").addEventListener("change", renderLyrics);
document.getElementById("fontSize").addEventListener("input", renderLyrics);

renderLyrics();

</script>

</body>
</html>
